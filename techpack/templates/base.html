<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tech Pack Generator{% endblock %}</title>
<style>
  :root { --ink:#111; --muted:#666; --line:#d9d9d9; --bg:#f4f4f2; --panel:#fff; --accent:#1f3a5f; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  a { color: var(--accent); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 20px; margin-bottom: 20px; }
  label { display:block; font-weight:600; font-size:12px; margin: 0 0 4px; }
  input[type=text], select, textarea { width:100%; padding:8px 10px; border:1px solid #bbb; font: inherit; background:#fff; }
  textarea { min-height: 70px; resize: vertical; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .full { grid-column: 1 / -1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  button, .btn { display:inline-block; background: var(--ink); color:#fff; border:0; padding: 10px 18px; font: inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--ink); }
  .error { background:#fde8e8; border:1px solid #e0a0a0; color:#8a1f1f; padding:10px 14px; margin-bottom:16px; }
  table { width:100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { border:1px solid var(--line); padding: 6px 8px; text-align:left; vertical-align: top; }
  th { background:#f0f0ee; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  #loading { display:none; position:fixed; inset:0; background:rgba(255,255,255,.92); z-index:10; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding: 16px; }
  #loading.on { display:flex; }
  .spinner { width:40px; height:40px; border:4px solid #ddd; border-top-color: var(--ink); border-radius:50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div id="loading"><div class="spinner"></div><strong id="loading-text">Generating tech pack…</strong><div class="muted">This usually takes 1–4 minutes. Keep this tab open.</div></div>
{% block body %}{% endblock %}
<script>
  document.querySelectorAll("form[data-loading]").forEach(f => f.addEventListener("submit", () => {
    document.getElementById("loading-text").textContent = f.dataset.loading;
    document.getElementById("loading").classList.add("on");
  }));
</script>
</body>
</html>
